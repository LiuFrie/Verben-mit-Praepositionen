<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verben mit Präpositionen · LiuFrie</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box} body{margin:0}
header{background:#172033;color:white;padding:16px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0} .counter{font-weight:700;white-space:nowrap}
main{max-width:900px;margin:24px auto;padding:0 16px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}
button,input{font:inherit} button{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;background:#e4e9f1;color:#172033}
button:hover{filter:brightness(.97)} .primary{background:#172033;color:white}
.progress{height:8px;background:#dce2ec;border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar{height:100%;width:0;background:#172033;transition:.25s}
.card{perspective:1300px;min-height:650px;cursor:pointer}
.inner{position:relative;min-height:650px;transition:transform .55s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:white;border-radius:24px;box-shadow:0 14px 45px #17203320;padding:30px;display:flex;flex-direction:column}
.back{transform:rotateY(180deg);overflow:auto}
.tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.verb{font-size:44px;text-align:center;margin:45px 0 15px;font-weight:800}
.instruction{text-align:center;color:#667085;margin-bottom:14px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:620px;width:100%;margin:0 auto}
.option{font-weight:800;border:2px solid transparent;background:#eef1f6}
.option.correct{background:#dff5e5;border-color:#36a269;color:#17633b}
.option.wrong{background:#fde2e2;border-color:#d45b5b;color:#8b2222}
.entry{display:flex;gap:8px;max-width:620px;margin:14px auto 0;width:100%}
.entry input{flex:1;padding:12px;border:2px solid #d7dde7;border-radius:11px}
.feedback{min-height:48px;text-align:center;font-weight:800;padding:12px}
.example{font-size:20px;line-height:1.55;background:#f4f6fb;border-radius:16px;padding:20px;margin:24px 0}
.trans{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lang{padding:15px;background:#f4f6fb;border-radius:14px}
.lang b{display:block;font-size:11px;opacity:.55;margin-bottom:5px}
.footer{margin-top:auto;text-align:center;font-size:11px;opacity:.5}
.edit{display:none;margin-top:18px;border-top:1px solid #e2e6ee;padding-top:18px}
.edit.open{display:block} .editgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editgrid label{font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:5px}
.editgrid input,.editgrid textarea{padding:9px;border:1px solid #cfd6e2;border-radius:9px}
.editgrid textarea{min-height:70px;resize:vertical}
.small{font-size:12px;color:#667085}
@media(max-width:600px){.options,.trans,.editgrid{grid-template-columns:1fr}.verb{font-size:34px;margin:34px 0 12px}.face,.inner,.card{min-height:700px}}
</style>
</head>
<body>
<header><h1>Verben mit Präpositionen</h1><div class="counter" id="counter"></div></header>
<main>
<div class="toolbar">
<button class="primary" onclick="prev()">← Zurück</button>
<button class="primary" onclick="next()">Weiter →</button>
<button onclick="shuffle()">🔀 Mischen</button>
<button onclick="resetScore()">↺ Punkte</button>
<button onclick="toggleEdit()">✎ Karte bearbeiten</button>
<button onclick="deleteCurrent()" style="background:#fde2e2;color:#8b2222">🗑 Karte löschen</button>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="card" id="card" onclick="flip(event)">
<div class="inner">
<section class="face front">
<div class="tag">Karteikarte · Vorderseite</div>
<div class="verb" id="verb"></div>
<div class="instruction">Welche Präposition passt?</div>
<button class="primary" id="speakBtn" onclick="speakCurrent(event)" style="align-self:center;margin-bottom:14px">🔊 Verb anhören</button>
<div class="options" id="options"></div>
<div class="entry">
<input id="answerInput" placeholder="Präposition eingeben, z. B. auf" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')checkTyped(event)">
<button class="primary" onclick="checkTyped(event)">Prüfen</button>
</div>
<div class="feedback" id="feedback"></div>
<div class="footer">LiuFrie · ChatGPT</div>
</section>

<section class="face back">
<div class="tag">Karteikarte · Rückseite</div>
<button class="primary" onclick="speakExample(event)" style="align-self:center">🔊 Beispielsatz anhören</button>
<div class="example" id="example"></div>
<div class="trans" id="trans"></div>
<div style="text-align:center;margin-top:18px;color:#667085">Klicke auf die Karte, um zurückzublättern.</div>

<div class="edit" id="editPanel" onclick="event.stopPropagation()">
<div class="small">Änderungen werden in diesem Browser gespeichert. Du kannst die Karte jederzeit korrigieren.</div>
<div class="editgrid" style="margin-top:10px">
<label>Verb<input id="eVerb"></label>
<label>Beispielsatz<textarea id="eSentence"></textarea></label>
<label>Richtige Präposition<input id="eCorrect"></label>
<label>Präposition 2<input id="eOpt2"></label>
<label>Präposition 3<input id="eOpt3"></label>
<label>Präposition 4<input id="eOpt4"></label>
<label>Ukrainisch<input id="eUk"></label>
<label>Englisch<input id="eEn"></label>
<label>Französisch<input id="eFr"></label>
<label>Arabisch<input id="eAr" dir="rtl"></label>
</div>
<button class="primary" style="margin-top:12px" onclick="saveEdit(event)">Änderung speichern</button>
</div>
<div class="footer">LiuFrie · ChatGPT</div>
</section>
</div></div>
</main>

let deck=JSON.parse(localStorage.getItem('liufrie-verben-deck-v2')||'null')||originalCards;
let idx=0,score=0,answered=false;

function baseVerb(v){return v.replace(/^\(sich\)\s*/,'').replace(/^sich\s*/,'').replace(/\s*\(.+?\)$/,'').trim()}
function render(){
 const c=deck[idx], card=document.getElementById('card');
 card.classList.remove('flipped'); answered=false;
 document.getElementById('verb').textContent=c.verb;
 document.getElementById('counter').textContent=`${idx+1} / ${deck.length} · Punkte: ${score}`;
 document.getElementById('bar').style.width=`${((idx+1)/deck.length)*100}%`;
 document.getElementById('feedback').textContent='';
 document.getElementById('answerInput').value='';
 const box=document.getElementById('options'); box.innerHTML='';
 c.options.slice(0,4).forEach(p=>{
   const b=document.createElement('button'); b.className='option'; b.textContent=p;
   b.onclick=(e)=>{e.stopPropagation();answer(p,b)}; box.appendChild(b);
 });
 document.getElementById('example').innerHTML='<b>Beispielsatz:</b> '+escapeHtml(c.sentence);
 const t=c.translations||{};
 document.getElementById('trans').innerHTML=[
 ['Українська',t['Українська']||''],['English',t.English||''],['Français',t.Français||''],['العربية',t['العربية']||'']
 ].map(x=>`<div class="lang"><b>${x[0]}</b>${escapeHtml(x[1])}</div>`).join('');
 fillEdit(c);
}
function answer(p,b){
 if(answered)return; answered=true;
 const c=deck[idx], correct=c.correct.includes(p);
 document.querySelectorAll('.option').forEach(x=>{if(c.correct.includes(x.textContent))x.classList.add('correct')});
 if(correct){b.classList.add('correct');score++;document.getElementById('feedback').textContent='✅ Richtig!';}
 else{b.classList.add('wrong');document.getElementById('feedback').textContent='❌ Falsch. Die richtige Präposition ist: '+c.correct.join(' / ');}
 updateCounter();
}
function checkTyped(e){
 e.stopPropagation(); if(answered)return;
 const value=document.getElementById('answerInput').value.trim().toLowerCase();
 const c=deck[idx];
 if(!value){document.getElementById('feedback').textContent='Bitte gib eine Präposition ein.';return}
 const match=c.correct.some(x=>x.toLowerCase()===value);
 answered=true;
 document.querySelectorAll('.option').forEach(x=>{if(c.correct.includes(x.textContent))x.classList.add('correct')});
 document.getElementById('feedback').textContent=match?'✅ Richtig!':'❌ Falsch. Die richtige Präposition ist: '+c.correct.join(' / ');
 if(match)score++;
 updateCounter();
}
function updateCounter(){document.getElementById('counter').textContent=`${idx+1} / ${deck.length} · Punkte: ${score}`}
function flip(e){if(e.target.closest('button,input,textarea'))return;document.getElementById('card').classList.toggle('flipped')}
function next(){idx=(idx+1)%deck.length;render()}
function prev(){idx=(idx-1+deck.length)%deck.length;render()}
function shuffle(){deck.sort(()=>Math.random()-.5);idx=0;render()}
function resetScore(){score=0;render()}
function speak(text){
 if(!('speechSynthesis' in window)){alert('Dieser Browser unterstützt keine Sprachausgabe.');return;}
 const fullText=String(text||'').trim();
 if(!fullText)return;
 const voices=speechSynthesis.getVoices();
 const deDE=voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-')==='de-de');
 if(!deDE.length){alert('Keine deutsche Stimme für Deutsch (Deutschland), de-DE, gefunden. Bitte im Betriebssystem oder Browser eine deutsche Stimme (Deutschland) installieren/aktivieren. Es wird keine englische Ersatzstimme verwendet.');return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(fullText);
 u.lang='de-DE';
 u.voice=deDE.find(v=>v.default)||deDE[0];
 u.rate=.92; u.pitch=1; u.volume=1;
 speechSynthesis.speak(u);
}
function speakCurrent(e){e.stopPropagation();speak(deck[idx].verb)}
function speakExample(e){e.stopPropagation();speak(deck[idx].sentence)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function deleteCurrent(){
 const c=deck[idx];
 const ok=confirm('Diese Karte wirklich löschen?\\n\\n'+c.verb);
 if(!ok)return;
 deck.splice(idx,1);
 if(deck.length===0){
   localStorage.removeItem('liufrie-verben-deck-v2');
   alert('Alle Karten wurden gelöscht.');
   location.reload();
   return;
 }
 idx=Math.min(idx,deck.length-1);
 localStorage.setItem('liufrie-verben-deck-v2',JSON.stringify(deck));
 render();
} 
function toggleEdit(){document.getElementById('editPanel').classList.toggle('open');fillEdit(deck[idx])}
function fillEdit(c){
 document.getElementById('eVerb').value=c.verb;
 document.getElementById('eSentence').value=c.sentence;
 document.getElementById('eCorrect').value=c.correct.join(' / ');
 document.getElementById('eOpt2').value=c.options[1]||'';
 document.getElementById('eOpt3').value=c.options[2]||'';
 document.getElementById('eOpt4').value=c.options[3]||'';
 const t=c.translations||{};
 document.getElementById('eEn').value=t.English||'';
 document.getElementById('eFr').value=t.Français||'';
 document.getElementById('eUk').value=t['Українська']||'';
 document.getElementById('eAr').value=t['العربية']||'';
}
function saveEdit(e){
 e.stopPropagation(); const c=deck[idx];
 c.verb=document.getElementById('eVerb').value.trim();
 c.sentence=document.getElementById('eSentence').value.trim();
 c.correct=document.getElementById('eCorrect').value.split('/').map(x=>x.trim()).filter(Boolean);
 let opts=[...new Set([c.correct[0],document.getElementById('eOpt2').value.trim(),document.getElementById('eOpt3').value.trim(),document.getElementById('eOpt4').value.trim()].filter(Boolean))];
 const pool=['an','auf','aus','bei','für','gegen','in','mit','nach','über','um','unter','von','vor','zu'];
 for(const p of pool){if(opts.length>=4)break;if(!opts.includes(p))opts.push(p)}
 c.options=opts.slice(0,4);
 c.translations={English:document.getElementById('eEn').value.trim(),Français:document.getElementById('eFr').value.trim(),'Українська':document.getElementById('eUk').value.trim(),'العربية':document.getElementById('eAr').value.trim()};
 localStorage.setItem('liufrie-verben-deck-v2',JSON.stringify(deck));
 render();
 document.getElementById('editPanel').classList.add('open');
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('card').classList.toggle('flipped')}});
speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
